{% extends 'base.html' %}

{% block title %}Something went wrong · {{ settings.site_name or 'Everlasting Horizon' }}{% endblock %}

{% block content %}
<section class="section">
  <div class="error-state">
    <span class="mark" style="font-size:3.5rem;" aria-hidden="true">✨</span>
    <h2>Something went wrong</h2>
    <p>The kingdom encountered an unexpected error. Please try again shortly.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">Return Home</a>
  </div>
</section>
{% endblock %}
