{% extends 'base.html' %}

{% block title %}Not Found · {{ settings.site_name or 'Everlasting Horizon' }}{% endblock %}

{% block content %}
<section class="section">

    <span class="mark" style="font-size:3.5rem;" aria-hidden="true">🍪</span>

{% endblock %}
