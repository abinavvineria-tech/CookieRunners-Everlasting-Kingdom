<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — EVERLASTING BLOOM</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pearl:#f6f2eb;--gold:#bfa15f;--navy:#1a1525;--glass:rgba(255,255,255,.35);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:linear-gradient(170deg,#120e1a 0%,#1a1525 100%);color:var(--pearl);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{max-width:400px;width:100%;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px;box-shadow:0 20px 50px rgba(11,14,20,.55);}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;margin-bottom:8px;}
p.subtitle{color:rgba(246,242,235,.6);font-size:.9rem;margin-bottom:28px;}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--pearl);font-family:inherit;font-size:.95rem;margin-top:8px;}
button{width:100%;margin-top:20px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#d4af37);border:none;font-family:inherit;font-weight:600;color:#3a2800;cursor:pointer;box-shadow:0 6px 24px rgba(191,161,95,.3);transition:all .2s;}
button:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(191,161,95,.45);}
</style>
</head>
<body>
<div class="card">
  <h1>Admin Access</h1>
  <p class="subtitle">EVERLASTING BLOOM — Moderation Portal</p>
  <form method="POST">
    <label for="password">Moderator Password</label>
    <input type="password" name="password" id="password" placeholder="Enter admin password" required>
    <button type="submit">Access Admin Panel</button>
  </form>
</div>
</body>
</html>
