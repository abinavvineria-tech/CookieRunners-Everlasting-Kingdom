[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lilyverse"
version = "1.0.0"
description = "LilyVerse — The Eternal Bloom Timeline. An unofficial Cookie Run fan project combining a Flask website and a CLI timeline manager."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CookieVerse Hermes (Abinav / abinavzoey)", email = "cookieverse@example.com"}]
keywords = ["cookie-run", "cookie-run-kingdom", "ovenbreak", "fan-project", "flask", "cli", "timeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Utilities",
]

[project.scripts]
lilyverse = "lilyverse.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-flask>=1.2",
]
rich = [
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lilyverse*"]

[tool.setuptools.package-data]
lilyverse = ["templates/*.html", "static/css/*.css", "static/js/*.js", "data/*.json"]
